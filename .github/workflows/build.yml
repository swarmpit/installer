name: Build & Deploy

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Swarmpit release tag to install'
        required: true
        default: '1.10'
        type: string

jobs:
  docker:
    name: Build and push docker
    runs-on: ubuntu-latest
    env:
      SECRET: ${{ secrets.PKG_USER }}
      VERSION: ${{ inputs.version || 'edge' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: validate release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Version must be a numeric Swarmpit release tag, for example 1.10."
            exit 1
          fi
          git ls-remote --exit-code --tags https://github.com/swarmpit/swarmpit.git "refs/tags/$VERSION" > /dev/null
      - name: set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: login to DockerHub
        if: env.SECRET != 0
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASS }}
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          build-args: tag=${{ env.VERSION }}
          context: .
          push: ${{ env.SECRET != 0 }}
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          tags: swarmpit/install:${{ env.VERSION }}
